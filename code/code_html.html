<!DOCTYPE html>
<!-- Comentario HTML: Token comment / punctuation -->
<html lang="es" data-test="true">
    <head>
        <title>Prueba de Tokens &amp; Colores</title>
    </head>
    <body style="background-color: #1e1e1e;
                 color: #d4d4d4;
                 font-family: 'Courier New', monospace;
                 margin: 0;
                 padding: 20px">
        <h1 style="color: #569cd6; font-size: 2em;">Lorem Ipsum Syntax</h1>
        <p style="font-weight: bold;
                  background: linear-gradient(90deg, rgba(255,0,0,0.2) 0%, transparent 100%);
                  padding: 10px;
                  border-radius: 4px">
            Lorem ipsum dolor sit amet, consectetur <span style="color: #ce9178;
              text-transform: uppercase">"adipiscing elit"</span>.
        </p>
    </body>
</html>
